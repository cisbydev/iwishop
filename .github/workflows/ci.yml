name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: iwishop_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iwishop_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-test-secret-key-not-for-production-0123456789
      DEBUG: "True"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/iwishop_test
      DATABASE_SSL_REQUIRE: "False"
      PAYDUNYA_MASTER_KEY: ci-test-master-key
      PAYDUNYA_PRIVATE_KEY: ci-test-private-key
      PAYDUNYA_PUBLIC_KEY: ci-test-public-key
      PAYDUNYA_TOKEN: ci-test-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sorashop-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sorashop-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
